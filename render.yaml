services:
  - type: web
    name: parpar-sagol
    plan: free
    runtime: node
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /admin/login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
